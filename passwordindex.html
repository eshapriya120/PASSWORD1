<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Analyzer</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        h1{
            color: #333;
        }

        input{
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button{
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover{
            background-color: darkblue;
        }

        #result{
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        #suggestion{
            font-size: 16px;
            margin-top: 10px;
            color: #555;
        }

        #meterBox{
            width: 300px;
            height: 20px;
            border: 1px solid black;
            margin: 20px auto;
            background-color: white;
        }

        #meter{
            height: 100%;
            width: 0%;
            background-color: red;
        }
    </style>
</head>

<body>

    <h1>Password Strength Analyzer</h1>

    <input type="password" id="password" placeholder="Enter Password">

    <br><br>

    <button id="checkBtn">Check Password</button>

    <div id="meterBox">
        <div id="meter"></div>
    </div>

    <p id="result"></p>

    <p id="suggestion"></p>

    <script>

        let button = document.getElementById("checkBtn");

        button.addEventListener("click", function(){

            let password = document.getElementById("password").value;

            let result = document.getElementById("result");

            let suggestion = document.getElementById("suggestion");

            let meter = document.getElementById("meter");

            if(password.length >= 16 &&
               /[A-Z]/.test(password) &&
               /[0-9].*[0-9].*[0-9].*[0-9]/.test(password) &&
               /[@#$%!].*[@#$%!]/.test(password))
            {
                result.innerHTML = "Strong Password";
                result.style.color = "green";

                suggestion.innerHTML =
                "Excellent! Your password is highly secure.";

                meter.style.width = "100%";
                meter.style.backgroundColor = "green";
            }

            else if(password.length >= 10 &&
                    password.length <= 15 &&
                    /[0-9].*[0-9]/.test(password) &&
                    /[@#$%!]/.test(password))
            {
                result.innerHTML = "Medium Password";
                result.style.color = "orange";

                suggestion.innerHTML =
                "Add capital letters and more special characters to make it stronger.";

                meter.style.width = "60%";
                meter.style.backgroundColor = "orange";
            }

            else if(password.length >= 6 &&
                    password.length <= 8)
            {
                result.innerHTML = "Weak Password";
                result.style.color = "red";

                suggestion.innerHTML =
                "Use more characters, numbers and special characters.";

                meter.style.width = "30%";
                meter.style.backgroundColor = "red";
            }

            else
            {
                result.innerHTML = "Weak Password";
                result.style.color = "red";

                suggestion.innerHTML =
                "Password does not meet the required conditions.";

                meter.style.width = "20%";
                meter.style.backgroundColor = "red";
            }

        });

    </script>

</body>
</html>
